# Local dev stack: API + BullMQ worker + Redis.
#
#   docker compose up -d --build
#
# Dev and prod Postgres live in Supabase, so the only database here is the throwaway
# one the integration tests provision into:
#
#   docker compose --profile test up -d postgres-test

services:
  api:
    build: ./backend
    init: true
    env_file: ./backend/.env
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
    ports:
      - '8080:8080'
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    init: true
    command: ['node', '--import', 'tsx', 'src/workers/resumeEnrichmentWorker.ts']
    env_file: ./backend/.env
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres-test:
    profiles: ['test']
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redisdata:
